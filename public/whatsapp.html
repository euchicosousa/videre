        --acento: #2b5a8f;         /* égeu 2 */
        --foco: #ebf5f9;
        --fonte: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; }
      body {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        padding: 2rem;
        overflow-x: hidden;
        background: var(--fundo);
        color: var(--texto);
        font-family: var(--fonte);
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }
      svg { display: block; }
      a { color: inherit; }
      :focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }

      /* Fundo quadriculado (grade de 120px, bem suave) */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.1;
        background-image: linear-gradient(to right, currentColor 1px, transparent 1px), linear-gradient(to bottom, currentColor 1px, transparent 1px);
        background-size: 120px 120px;
        pointer-events: none;
      }

      .conteudo { position: relative; display: flex; flex-direction: column; gap: 3rem; width: 100%; max-width: 36rem; margin-inline: auto; }

      /* Três formas girando em velocidades diferentes (só CSS) */
      .carregando { position: relative; width: 33.3333%; }
      .carregando svg { width: 100%; height: auto; animation: girar linear infinite; }
      .carregando .g1, .carregando .g2 { position: absolute; top: 0; }
      .carregando .g1 { left: 0; }
      .carregando .g2 { right: 0; }
      @keyframes girar { to { rotate: 360deg; } }

      h1 { font-size: clamp(2.25rem, 9vw, 3rem); line-height: 1; letter-spacing: -0.025em; font-weight: 500; }

      .citacao { position: relative; font-size: 1.5rem; }
      .aspas { position: absolute; top: -6rem; left: -2rem; font-size: 300px; line-height: 1; color: var(--acento); }
      .citacao blockquote, .citacao figcaption { position: relative; }
      .autor { font-size: 1rem; }

      .mensagem { padding: 1rem; background: var(--acento); }
      .manual { font-size: 0.875rem; }

      .logo-fim { align-self: flex-end; width: 10rem; }

      @media (prefers-reduced-motion: reduce) {
        .carregando svg { animation: none; }
      }
